# Minimal additions on top of the pgvector/pgvector:pg18 image defaults.
# Mounted at /etc/postgresql/postgresql.conf and loaded via -c config_file=...
# (see docker-compose.yml primary service command).

listen_addresses = '*'
wal_level = logical
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on

# logical (not just replica) so that Scenario B5's publication/replication-
# slot mechanism has what it needs. logical is a superset of replica -- B2's
# streaming physical replication is unaffected by this.

# Deliberately generous: for B2 we want to *control* replica lag ourselves
# (via a throttling proxy / artificial delay in the harness), not have
# Postgres's own defaults hide or amplify it unpredictably.
wal_sender_timeout = 60s

# RLS-relevant: force row security even for the table owner during the
# experiment, so Scenario B's access control is not silently bypassed by
# whichever role the harness connects as.
row_security = on
