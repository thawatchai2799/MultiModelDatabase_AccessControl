# Mounted at /etc/postgresql/pg_hba.conf on the primary.
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             0.0.0.0/0               md5

# Replication: only the dedicated replicator role, only from the Docker
# network. Not open to 0.0.0.0 -- this is a local experiment network, but
# replication traffic is deliberately scoped tighter than app traffic.
host    replication     replicator      0.0.0.0/0               scram-sha-256
