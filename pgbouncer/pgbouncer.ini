[databases]
mldb = host=postgres-primary port=5432 dbname=mldb
; Dedicated tiny-pool entry for Scenario B6 (pgbouncer session staleness).
; pool_size=1 forces every client connecting through *this* database name to
; share the exact same single backend server connection, making backend
; reuse (and therefore the SET app.principal_id staleness B6 tests for)
; deterministic instead of a matter of chance against the default pool's
; default_pool_size=20. Same backend Postgres database (dbname=mldb) --
; only the pgbouncer-side pool sizing differs.
mldb_b6 = host=postgres-primary port=5432 dbname=mldb pool_size=1 reserve_pool_size=0

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Transaction-pooling mode is the scenario B6 targets deliberately: a server
; connection is returned to the pool at transaction end and may be handed to
; a *different* client next. Session-level state that RLS depends on
; (SET app.principal_id = ...) does not automatically travel with the
; client -- if the app forgets to re-issue SET at the start of every pooled
; transaction, a stale session variable from a previous client can persist.
pool_mode = transaction

max_client_conn = 200
default_pool_size = 20

; Do NOT set server_reset_query to a no-op; leave pgbouncer's default
; (DISCARD ALL) OFF for this scenario specifically so that session state can
; actually leak between pooled transactions when the app fails to reset it --
; that leak is exactly what B6 is testing for. This is a deliberate
; misconfiguration, documented as such, not an oversight: a real deployment
; that *does* set DISCARD ALL correctly is expected to close this seam, and
; the harness must show both configurations for the result to be credible.
server_reset_query =
